# ~/.config/myna/whisper.conf : réglages du moteur Whisper de Myna, lus par
# myna-whisper.service. Après modification :
#   systemctl --user restart myna-whisper.service

# Modèle : tiny, base (défaut) ou small, téléchargé au préalable avec
#   myna-whisper-fetch-model <taille>
#MYNA_WHISPER_MODEL=base

# Type de calcul CTranslate2 : auto (valeur mesurée par l'amont pour chaque
# modèle), int8, int8_float32, float32.
#MYNA_WHISPER_COMPUTE_TYPE=auto

# Secondes d'inactivité avant de décharger le modèle de la mémoire.
#MYNA_WHISPER_IDLE=300

# true : transcription en continu (texte provisoire pendant la dictée).
#MYNA_WHISPER_STREAMING=false
