name: build

on:
  push:
    branches: [main]
    tags: ['debian/*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Outils de base
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # upstream/dev/version.sh a besoin de l'historique et des tags

      - name: Dépendances de compilation
        run: |
          apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper dh-cargo quilt meson ninja-build \
            pkg-config libgtk-4-dev libadwaita-1-dev libpipewire-0.3-dev \
            libclang-dev libwayland-dev wayland-protocols gettext lintian python3

      - name: Rust (version de upstream/client/rust-toolchain.toml) et uv
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          curl -fsSL https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compilation des paquets
        run: |
          git config --global --add safe.directory '*'
          (cd upstream/client && rustup show active-toolchain || rustup toolchain install)
          scripts/build.sh all

      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: build/*/*.deb
          if-no-files-found: warn

      - name: Publication sur le tag
        if: startsWith(github.ref, 'refs/tags/debian/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*/*.deb
