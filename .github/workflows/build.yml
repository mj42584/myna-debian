name: build

on:
  push:
    branches: [main]
    tags: ['debian/*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Outils de base
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # upstream/dev/version.sh a besoin de l'historique et des tags

      - name: Dépendances de compilation
        run: |
          apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper pkgconf gettext lintian python3 \
            libgtk-4-dev libadwaita-1-dev libpipewire-0.3-dev libclang-dev \
            libwayland-dev wayland-protocols libegl-dev libepoxy-dev libgl1-mesa-dev \
            libglib2.0-dev libglib2.0-dev-bin libgtk4-layer-shell-dev

      - name: Rust (version de upstream/client/rust-toolchain.toml) et uv
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          curl -fsSL https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compilation des paquets
        run: |
          git config --global --add safe.directory '*'
          (cd upstream/client && rustup show active-toolchain || rustup toolchain install)
          scripts/build.sh all
          # Paquets à publier (sans les symboles de débogage).
          mkdir -p dist
          find build -maxdepth 2 -name '*.deb' ! -name '*-dbgsym_*' -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/*.deb
          if-no-files-found: error

      # Publication : sur un tag debian/* poussé à la main, ou sur main quand
      # la version du changelog n'a pas encore de tag (merge d'une PR de mise à
      # jour de l'amont) ; le tag est alors créé par la release.
      - name: Version à publier
        id: release
        if: startsWith(github.ref, 'refs/tags/debian/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash   # dans un conteneur, le shell par défaut est sh
        run: |
          version="$(dpkg-parsechangelog -l packages/myna/debian/changelog -S Version)"
          tag="debian/${version//\~/_}"
          if [ "$GITHUB_REF" = refs/heads/main ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag existe déjà : rien à publier"
            exit 0
          fi
          if [ "$GITHUB_REF" != refs/heads/main ] && [ "$GITHUB_REF" != "refs/tags/$tag" ]; then
            echo "le tag $GITHUB_REF ne correspond pas au changelog ($tag)" >&2
            exit 1
          fi
          notes="packaging-notes/release-${version//\~/_}.md"
          [ -f "$notes" ] || notes=
          {
            echo "publish=true"
            echo "tag=$tag"
            echo "name=myna $version (Debian 13)"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

      - name: Publication
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.name }}
          body_path: ${{ steps.release.outputs.notes }}
          files: dist/*.deb
